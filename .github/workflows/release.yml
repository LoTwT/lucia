# Release builds for both channels, signed for MyGo's auto-update and
# published on GitHub Releases (LoTwT/lucia) — the feed mygo.json points at.
#
#   - test:   tags test-v<version>-<prerelease>, e.g. test-v0.0.1-rc.1.
#     The version itself is a prerelease (0.0.1-rc.1), so a rehearsal never
#     takes an official version number. Test releases are ordinary releases
#     but never the latest.
#   - stable: tags v<version>, e.g. v0.0.1. Stable builds read the latest
#     release, which test releases never become once a stable exists.
#
# A draft release is created before the builds so both platform jobs upload
# into the same draft. Versions come from tags: the checkout's mygo.json is
# rewritten (not committed) with the tag's version and channel prefix, and
# skip-worktree keeps that rewrite out of git status so the binary stamps the
# tag's clean commit. Every released version needs a "## <version>" section in
# CHANGELOG.md; it becomes the in-app release notes.
name: Release

on:
  push:
    tags:
      - "test-v*"
      - "v*"

permissions:
  contents: write # the draft release, uploads, and publishing it

jobs:
  draft-release:
    name: Validate the tag and create the draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the tag, the changelog and the update configuration
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            test-v*) prefix="test-v" ;;
            v*) prefix="v" ;;
            *) echo "ERROR: tag $tag matches neither test-v* nor v*"; exit 1 ;;
          esac
          version="${tag#"$prefix"}"
          # Stable tags use a plain version. Test tags must carry a
          # prerelease suffix so a rehearsal never takes an official version
          # number: test-v0.0.1-rc.1 is a prerelease of 0.0.1, not v0.0.1.
          if [ "$prefix" = "test-v" ]; then
            version_re='^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z][0-9A-Za-z.-]*$'
            version_hint='major.minor.patch-<prerelease> (for example 0.0.1-rc.1)'
          else
            version_re='^[0-9]+\.[0-9]+\.[0-9]+$'
            version_hint='major.minor.patch'
          fi
          if ! printf '%s' "$version" | grep -Eq "$version_re"; then
            echo "ERROR: tag $tag — the part after $prefix must be $version_hint, got: $version"
            exit 1
          fi
          echo "channel prefix: $prefix, version: $version"
          esc=$(printf '%s' "$version" | sed 's/\./\\./g')
          if ! grep -Eq "^## ${esc}( |\]|$)" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no \"## $version\" section"
            exit 1
          fi
          if [ "$(jq -r '.updates.publicKey // empty' mygo.json)" = "" ] ||
             [ "$(jq -r '.updates.github // empty' mygo.json)" != "LoTwT/lucia" ]; then
            echo "ERROR: mygo.json must carry updates.publicKey and updates.github (\"LoTwT/lucia\")"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  macos:
    name: Build and upload (darwin/arm64)
    needs: draft-release
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set the release version and channel in mygo.json
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            test-v*) prefix="test-v" ;;
            v*) prefix="v" ;;
            *) echo "ERROR: unexpected tag $tag"; exit 1 ;;
          esac
          version="${tag#"$prefix"}"
          # Never commit this rewrite. skip-worktree keeps it out of
          # `git status`, so Go's VCS stamp reports the tag's clean commit.
          git update-index --skip-worktree mygo.json
          jq --arg version "$version" --arg tagPrefix "$prefix" \
            '.version = $version | .updates.tagPrefix = $tagPrefix' mygo.json > mygo.json.tmp
          mv mygo.json.tmp mygo.json
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "building Lucia $version on channel prefix $prefix"
      - name: Build the app bundle, the DMG and the signed update, and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/arm64 -upload
      - name: Verify the bundle, the DMG, the signature and the update files
        shell: bash
        run: |
          set -u
          app="build/darwin-arm64/Lucia.app"
          dmg=$(find build/darwin-arm64 -maxdepth 1 -name '*.dmg' -print -quit)
          archive="build/darwin-arm64/lucia-${RELEASE_VERSION}-darwin-arm64.tar.gz"
          manifest="build/darwin-arm64/update-darwin-arm64.json"
          fail=0
          if [ ! -d "$app" ]; then
            echo "ERROR: missing app bundle: $app"
            fail=1
          fi
          if [ -z "$dmg" ]; then
            echo "ERROR: no DMG under build/darwin-arm64"
            fail=1
          fi
          if [ ! -f "$app/Contents/Resources/THIRD-PARTY-NOTICES.md" ]; then
            echo "ERROR: the bundle does not ship THIRD-PARTY-NOTICES.md"
            fail=1
          fi
          for f in "$archive" "$manifest"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: missing update file — MYGO_UPDATER_PRIVATE_KEY is missing or does not match updates.publicKey: $f"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          jq -e --arg version "$RELEASE_VERSION" --arg tag "$GITHUB_REF_NAME" \
            '.version == $version and (.url | contains("/" + $tag + "/"))' \
            "$manifest" > /dev/null || {
            echo "ERROR: $manifest does not serve version $RELEASE_VERSION from tag $GITHUB_REF_NAME"
            cat "$manifest"
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Self-test on the packaged app
        shell: bash
        run: |
          set -e
          LUCIA_SELFTEST=1 "build/darwin-arm64/Lucia.app/Contents/MacOS/Lucia" 2>selftest-stderr.txt
          cat selftest-stderr.txt
          grep -q 'updates=enabled' selftest-stderr.txt || {
            echo "ERROR: a release build must have updates on"
            exit 1
          }
          grep -q "version=${RELEASE_VERSION}" selftest-stderr.txt || {
            echo "ERROR: the packaged app does not report version ${RELEASE_VERSION}"
            exit 1
          }

  windows:
    name: Build and upload (windows/amd64)
    needs: draft-release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set the release version and channel in mygo.json
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            test-v*) prefix="test-v" ;;
            v*) prefix="v" ;;
            *) echo "ERROR: unexpected tag $tag"; exit 1 ;;
          esac
          version="${tag#"$prefix"}"
          git update-index --skip-worktree mygo.json
          jq --arg version "$version" --arg tagPrefix "$prefix" \
            '.version = $version | .updates.tagPrefix = $tagPrefix' mygo.json > mygo.json.tmp
          mv mygo.json.tmp mygo.json
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "building Lucia $version on channel prefix $prefix"
      - name: Build the EXE, the installer and the signed update, and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64 -upload
      - name: Verify the EXE, the installer and the update files
        shell: bash
        run: |
          set -u
          exe="build/windows-amd64/Lucia.exe"
          installer=$(find build/windows-amd64 -maxdepth 1 -name '*Setup*.exe' -print -quit)
          archive="build/windows-amd64/lucia-${RELEASE_VERSION}-windows-amd64.tar.gz"
          manifest="build/windows-amd64/update-windows-amd64.json"
          fail=0
          if [ ! -f "$exe" ]; then
            echo "ERROR: missing executable: $exe"
            fail=1
          fi
          if [ -z "$installer" ]; then
            echo "ERROR: no NSIS installer under build/windows-amd64"
            fail=1
          fi
          if [ ! -f "build/windows-amd64/THIRD-PARTY-NOTICES.md" ]; then
            echo "ERROR: the package does not ship THIRD-PARTY-NOTICES.md"
            fail=1
          fi
          for f in "$archive" "$manifest"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: missing update file — MYGO_UPDATER_PRIVATE_KEY is missing or does not match updates.publicKey: $f"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          jq -e --arg version "$RELEASE_VERSION" --arg tag "$GITHUB_REF_NAME" \
            '.version == $version and (.url | contains("/" + $tag + "/"))' \
            "$manifest" > /dev/null || {
            echo "ERROR: $manifest does not serve version $RELEASE_VERSION from tag $GITHUB_REF_NAME"
            cat "$manifest"
            exit 1
          }
      - name: Self-test on the packaged app
        shell: pwsh
        run: |
          $env:LUCIA_SELFTEST = "1"
          $p = Start-Process "build/windows-amd64/Lucia.exe" -NoNewWindow -Wait -PassThru `
            -RedirectStandardError selftest-stderr.txt -RedirectStandardOutput selftest-stdout.txt
          Get-Content selftest-stderr.txt
          if ($p.ExitCode -ne 0) { throw "self-test exited with $($p.ExitCode)" }
          $log = Get-Content selftest-stderr.txt -Raw
          if ($log -notmatch 'updates=enabled') { throw "a release build must have updates on" }
          if ($log -notmatch [regex]::Escape("version=$env:RELEASE_VERSION")) {
            throw "the packaged app does not report version $env:RELEASE_VERSION"
          }

  publish:
    name: Verify the assets and publish the release
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the assets and the manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            test-v*) prefix="test-v" ;;
            v*) prefix="v" ;;
            *) echo "ERROR: unexpected tag $tag"; exit 1 ;;
          esac
          version="${tag#"$prefix"}"
          mkdir -p "$RUNNER_TEMP/manifests"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'update-*.json' --dir "$RUNNER_TEMP/manifests"
          # GitHub stores spaces in asset names as dots.
          expected=(
            "Lucia.${version}.arm64.dmg"
            "Lucia.Setup.${version}.amd64.exe"
            "lucia-${version}-darwin-arm64.tar.gz"
            "lucia-${version}-windows-amd64.tar.gz"
            "update-darwin-arm64.json"
            "update-windows-amd64.json"
          )
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for name in "${expected[@]}"; do
            if ! printf '%s\n' "$assets" | grep -Fxq "$name"; then
              echo "ERROR: the draft release is missing $name"
              printf '%s\n' "$assets"
              exit 1
            fi
          done
          jq -e --arg version "$version" --arg tag "$tag" \
            '.version == $version and (.url | contains("/" + $tag + "/"))' \
            "$RUNNER_TEMP"/manifests/update-*.json
      - name: Publish the release for its channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            test-v*) prefix="test-v" ;;
            v*) prefix="v" ;;
            *) echo "ERROR: unexpected tag $tag"; exit 1 ;;
          esac
          version="${tag#"$prefix"}"
          if [ "$prefix" = "test-v" ]; then
            body=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
            {
              echo "> 测试版，勿用。仅用于验证自动更新链路。"
              echo
              printf '%s\n' "$body"
            } > "$RUNNER_TEMP/notes.md"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=false --latest=false \
              --title "Lucia ${version}（测试版，勿用）" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=false --latest=true \
              --title "Lucia ${version}"
          fi
